name: Performance Regression Detection

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.gitignore'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Baseline git ref (branch/tag/commit)'
        required: false
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGRESSION_THRESHOLD: 5.0
  VARIANCE_THRESHOLD: 2.0

jobs:
  performance-benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-12 \
            g++-12 \
            libjemalloc-dev \
            libvulkan-dev \
            python3 \
            python3-pip \
            linux-tools-common \
            linux-tools-generic
      
      - name: Install Python dependencies
        run: |
          pip3 install --user numpy scipy matplotlib pandas
      
      - name: Build current version (Release + optimizations)
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -B build-current -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=native -mtune=native" \
            -DCMAKE_CXX_FLAGS="-O3 -march=native -mtune=native"
          cmake --build build-current
      
      - name: Run current benchmarks
        run: |
          mkdir -p results/current
          if [ -d "build-current/tests/performance" ]; then
            cd build-current/tests/performance
            
            for bench in perf_test_*; do
              if [ -x "$bench" ]; then
                echo "Running $bench..."
                ./"$bench" || echo "Benchmark $bench failed or timed out"
              fi
            done
            
            # Copy all benchmark results
            cp benchmark_results_*.txt ../../../results/current/ 2>/dev/null || true
          else
            echo "Performance tests not found"
          fi
          
          # Generate summary
          cat > results/current/summary.txt << EOF
          Benchmark Run Summary
          =====================
          Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Compiler: gcc-12
          Optimization: -O3 -march=native
          EOF
      
      - name: Determine baseline reference
        id: baseline
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.baseline_ref }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=main" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout baseline version
        run: |
          git fetch origin ${{ steps.baseline.outputs.ref }}
          git checkout ${{ steps.baseline.outputs.ref }}
      
      - name: Build baseline version
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          rm -rf build-baseline
          cmake -B build-baseline -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=native -mtune=native" \
            -DCMAKE_CXX_FLAGS="-O3 -march=native -mtune=native"
          cmake --build build-baseline
      
      - name: Run baseline benchmarks
        run: |
          mkdir -p results/baseline
          if [ -d "build-baseline/tests/performance" ]; then
            cd build-baseline/tests/performance
            
            for bench in perf_test_*; do
              if [ -x "$bench" ]; then
                echo "Running $bench (baseline)..."
                ./"$bench" || echo "Benchmark $bench failed or timed out"
              fi
            done
            
            cp benchmark_results_*.txt ../../../results/baseline/ 2>/dev/null || true
          else
            echo "Baseline performance tests not found"
          fi
          
          cat > results/baseline/summary.txt << EOF
          Baseline Benchmark Summary
          ==========================
          Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Reference: ${{ steps.baseline.outputs.ref }}
          Compiler: gcc-12
          Optimization: -O3 -march=native
          EOF
      
      - name: Compare performance
        id: compare
        run: |
          cat > compare_results.py << 'PYTHON_SCRIPT'
          #!/usr/bin/env python3
          import os
          import sys
          import re
          from pathlib import Path
          
          def parse_benchmark_file(filepath):
              """Parse benchmark results file."""
              results = {}
              with open(filepath, 'r') as f:
                  for line in f:
                      # Parse lines like: size_1024_p99_ns=2140
                      match = re.match(r'(\w+)=(\d+)', line.strip())
                      if match:
                          key, value = match.groups()
                          results[key] = int(value)
              return results
          
          def compare_benchmarks(baseline_dir, current_dir, threshold=5.0):
              """Compare benchmark results and detect regressions."""
              baseline_files = list(Path(baseline_dir).glob('benchmark_results_*.txt'))
              current_files = list(Path(current_dir).glob('benchmark_results_*.txt'))
              
              regressions = []
              improvements = []
              
              for baseline_file in baseline_files:
                  current_file = Path(current_dir) / baseline_file.name
                  if not current_file.exists():
                      continue
                  
                  baseline_results = parse_benchmark_file(baseline_file)
                  current_results = parse_benchmark_file(current_file)
                  
                  for key in baseline_results:
                      if key not in current_results:
                          continue
                      
                      baseline_val = baseline_results[key]
                      current_val = current_results[key]
                      
                      if baseline_val == 0:
                          continue
                      
                      change_pct = ((current_val - baseline_val) / baseline_val) * 100
                      
                      if change_pct > threshold:
                          regressions.append((key, baseline_val, current_val, change_pct))
                      elif change_pct < -threshold:
                          improvements.append((key, baseline_val, current_val, change_pct))
              
              return regressions, improvements
          
          def main():
              baseline_dir = 'results/baseline'
              current_dir = 'results/current'
              threshold = float(os.environ.get('REGRESSION_THRESHOLD', '5.0'))
              
              regressions, improvements = compare_benchmarks(baseline_dir, current_dir, threshold)
              
              print("# Performance Comparison Report")
              print()
              print(f"Threshold: {threshold}%")
              print()
              
              if regressions:
                  print("## Regressions Detected")
                  print()
                  print("| Metric | Baseline | Current | Change |")
                  print("|--------|----------|---------|--------|")
                  for key, baseline, current, change in regressions:
                      print(f"| {key} | {baseline} ns | {current} ns | +{change:.1f}% |")
                  print()
              
              if improvements:
                  print("## Performance Improvements")
                  print()
                  print("| Metric | Baseline | Current | Change |")
                  print("|--------|----------|---------|--------|")
                  for key, baseline, current, change in improvements:
                      print(f"| {key} | {baseline} ns | {current} ns | {change:.1f}% |")
                  print()
              
              if not regressions and not improvements:
                  print("No significant performance changes detected.")
                  print()
              
              # Exit with error if regressions found
              if regressions:
                  print("REGRESSION_DETECTED=true")
                  sys.exit(1)
              else:
                  print("REGRESSION_DETECTED=false")
                  sys.exit(0)
          
          if __name__ == '__main__':
              main()
          PYTHON_SCRIPT
          
          chmod +x compare_results.py
          python3 compare_results.py > regression_report.md 2>&1 || \
            echo "REGRESSION_DETECTED=true" >> $GITHUB_OUTPUT
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            results/
            regression_report.md
          retention-days: 30
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let report = '';
            try {
              report = fs.readFileSync('regression_report.md', 'utf8');
            } catch (e) {
              report = 'Error reading regression report';
            }
            
            // Truncate if too long
            if (report.length > 65000) {
              report = report.substring(0, 65000) + '\n\n... (truncated)';
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
      
      - name: Fail if regression detected
        if: steps.compare.outputs.REGRESSION_DETECTED == 'true'
        run: |
          echo "Performance regression detected!"
          echo "Review the regression report above."
          echo ""
          echo "If the regression is acceptable:"
          echo "  1. Document the reason in the PR description"
          echo "  2. Update performance targets if needed"
          echo "  3. Get approval from maintainers"
          exit 1
      
      - name: Update baseline (on main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Baseline updated with commit ${{ github.sha }}"
          # In production, this would upload to artifact storage
          # or commit to a separate baseline branch

  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-12 \
            valgrind \
            massif-visualizer \
            libjemalloc-dev
      
      - name: Build with debug symbols
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
      
      - name: Run memory profiling
        run: |
          if [ -d "build/tests/performance" ]; then
            cd build/tests/performance
            
            for bench in perf_test_memory_*; do
              if [ -x "$bench" ]; then
                echo "Profiling $bench..."
                valgrind --tool=massif \
                  --massif-out-file=massif.$bench.out \
                  ./"$bench" || true
              fi
            done
          else
            echo "Performance tests not found, skipping memory profiling"
          fi
      
      - name: Generate memory reports
        run: |
          if [ -d "build/tests/performance" ]; then
            cd build/tests/performance
            
            for massif_file in massif.*.out; do
              if [ -f "$massif_file" ]; then
                ms_print "$massif_file" > "${massif_file}.txt"
              fi
            done
          fi
      
      - name: Upload memory profiles
        uses: actions/upload-artifact@v4
        with:
          name: memory-profiles
          path: build/tests/performance/massif.*
          retention-days: 7
