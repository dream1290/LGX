# =============================================================================
# The gate this repository can actually run.
#
# Every step below was executed locally, in this order, against this tree; the
# exit code each one produced is recorded in the ground-truth task-5 report.
# Nothing here refers to a path that does not exist, and no step is silenced
# with `|| true` to make the workflow go green.
#
# The previous ci.yml could never pass. Its `code-quality` job ran clang-format
# over 157 files that have never been clang-formatted (there is no .clang-format
# in the repo at all), its build-and-test ran `cmake --install`, which fails
# because tests/abi/CMakeLists.txt installs scripts/lgx-abi-test-matrix.sh and
# that file has never been committed (.gitignore ignores /scripts/*), and its
# test step ended in `|| true`, which made the result meaningless even when it
# ran. Seven other workflows in this directory have the same missing-path
# problem; fixing them is out of scope for this file and is inventoried in
# .github/workflows/README.md instead.
#
# Jobs:
#   build-and-test  the merge gate. Later plans EXTEND this job rather than
#                   adding a parallel one.
#   asan-ubsan      the Debug build's own -fsanitize=address/undefined run.
#   no-vulkan       deliberately RED. Documents a real, unfixed defect.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The three tests named here are unfixed intermittent defects in the threading
  # module -- measured locally at 5/30, 3/30 and 1/30 runs. They are RETRIED
  # before they are judged; they are not skipped, and they are not only
  # allowlisted either. See .github/ci/known-test-failures.txt.
  FLAKY_TESTS: '^test_threading_basic$|^test_threading_stress$|^benchmark_threading$'

jobs:
  # ===========================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libnuma-dev libjemalloc-dev libasound2-dev

      # ubuntu-22.04 rather than ubuntu-latest on purpose: it is what the
      # previous workflow's primary jobs ran on, so this is the one environment
      # whose behaviour the project has any history with. `latest` now means
      # 24.04 and nothing here has been run on it.
      #
      # No `-G Ninja` either. The default Unix Makefiles generator is the one
      # scripts/count_tests.sh was verified against (it reads
      # CMakeFiles/<exe>.dir/DependInfo.cmake; the Ninja branch is a fallback
      # this workflow has not been run through).
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # There is deliberately no `cmake --install` step. It cannot succeed:
      # tests/abi/CMakeLists.txt installs ${CMAKE_SOURCE_DIR}/scripts/
      # lgx-abi-test-matrix.sh, which does not exist and never has, so
      # `cmake --install` dies with "No such file or directory". Fixing that
      # needs either the missing script or an edit to a CMakeLists.txt, both out
      # of scope here. Re-adding the step before that is fixed just restores the
      # red build.
      #
      # CMakeLists.txt:14 already puts -Werror in CMAKE_C_FLAGS, so a source
      # warning fails the build outright. The grep below catches warnings that
      # arrive from a class -Werror does not cover.
      #
      # The grep is scoped to compiler diagnostics in this repository's own
      # sources on purpose: an unscoped `grep warning:` also matches linker noise
      # from third-party runtimes. The Debug build emits three
      # "libasan.so.8: warning: the use of `tmpnam' is dangerous" lines, none of
      # them ours, and a gate that cries wolf gets deleted.
      - name: Build (zero compiler warnings required)
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log
          warnings="$(grep -E '^[^ ]+\.(c|h|cpp|hpp):[0-9]+:[0-9]+: warning:' build.log || true)"
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::The build emitted compiler warnings in this project's sources. Zero is required."
            exit 1
          fi
          echo "PASS: zero compiler warnings in this project's sources."

      # The whole test-integrity contract rests on these four scripts staying
      # tracked by git. .gitignore ignores /scripts/* and un-ignores only the
      # gates, so this is the one check that notices when that stops being true.
      - name: CI gate scripts are tracked by git
        run: scripts/check_gate_scripts_tracked.sh

      # The public header must be consumable from C++ as well as C. The target
      # enables CXX for itself (tests/abi/CMakeLists.txt) even though the
      # top-level project() declares LANGUAGES C only.
      - name: C++ header consumability gate
        run: ctest --test-dir build -R '^abi_test_cpp_header_compiles$' --output-on-failure

      # Runs every registered test. Nothing is excluded except the flaky subset,
      # which is run immediately afterwards with retries, so no test is skipped.
      # Failures are then judged BY NAME against
      # .github/ci/known-test-failures.txt: an unlisted failure exits 1, a
      # listed failure is a ::warning:: carrying its recorded reason.
      - name: Test suite
        run: .github/ci/run-tests.sh build release "$FLAKY_TESTS" 3

      # Textual, and needs no build: the frame-arena benchmark must still reset
      # between frames, mute stderr around the timed region, pin itself to a CPU
      # and emit the line downstream performance gates parse. If the benchmark
      # regresses to measuring something other than a frame pattern, its number
      # stops meaning anything, and this is what notices.
      - name: Benchmark methodology gate
        run: scripts/verify_benchmark_methodology.sh

      # Blocking, and safe to block. count_tests.sh exits 0 on a complete census
      # and non-zero only for real infrastructure faults: an unconfigured tree
      # (2), or a registered test that cannot be tied to any source (3). It
      # never reports a pass rate, so letting it block costs nothing.
      # It needs a CONFIGURED tree -- CMake's per-target metadata is written at
      # configure time, not at build time.
      - name: Test integrity census (blocking)
        run: scripts/count_tests.sh build

      # -------------------------------------------------------------------------
      # NOT blocking, and here is exactly why.
      #
      # scripts/verify_test_integrity.sh exits 1 today: 30 of 98 test files
      # cannot report failure at all. That is a real defect and Plan 03's job to
      # fix -- but making it a hard gate today buys a check that is red on every
      # commit forever, and a permanently red check is disabled within a week
      # and is then worth nothing. Appending `|| true` to the step buys the
      # opposite failure: a gate that cannot fail, which is the exact condition
      # this whole plan exists to end.
      #
      # So this step is a RATCHET, and it is a real step -- not
      # continue-on-error -- because the script below exits 0 while the backlog
      # stands and exits 1 the moment it grows. The full report goes into the
      # job summary where a human will see it. New tests that cannot fail are
      # caught immediately; the existing backlog is tracked, not forgotten.
      #
      # Baseline 30 incapable / 98 checked, measured on this tree. TODO(plan-03):
      # lower BASELINE_INCAPABLE in the same commit that repairs files, and
      # delete the ratchet arithmetic once it reaches 0.
      # -------------------------------------------------------------------------
      - name: Test integrity gate (ratchet; read the comment above)
        env:
          BASELINE_INCAPABLE: '30'
        run: |
          set +e
          scripts/verify_test_integrity.sh > integrity.txt 2>&1
          rc=$?
          set -e
          cat integrity.txt

          incapable="$(sed -nE 's/.*incapable=([0-9]+).*/\1/p' integrity.txt | tail -1)"
          checked="$(sed -nE 's/.*checked=([0-9]+).*/\1/p' integrity.txt | tail -1)"
          verifying="$(sed -nE 's/.*verifying=([0-9]+).*/\1/p' integrity.txt | tail -1)"

          if [ -z "$incapable" ]; then
            echo "::error::Could not parse the integrity census out of integrity.txt."
            exit 1
          fi

          {
            echo "### Test integrity"
            echo ""
            echo "- files checked: $checked"
            echo "- can report failure: $verifying"
            echo "- **CANNOT report failure: $incapable** (ratchet baseline: $BASELINE_INCAPABLE)"
            echo ""
            echo "A test file with no live failure mechanism passes unconditionally, so it"
            echo "inflates the pass rate without testing anything. $incapable of them are tracked"
            echo "for Plan 03. This gate blocks if that number grows; it does not block on the"
            echo "backlog it cannot fix."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$incapable" -gt "$BASELINE_INCAPABLE" ]; then
            echo "::error::Test integrity REGRESSED: $incapable test file(s) cannot report failure; the baseline is $BASELINE_INCAPABLE."
            echo "       A test that cannot fail is a defect. Fix it. If it is genuinely"
            echo "       pre-existing, record it in .github/ci/known-test-failures.txt with the"
            echo "       reason -- do not silence the step."
            exit 1
          fi

          if [ "$rc" -ne 0 ] && [ "$incapable" -eq 0 ]; then
            echo "::error::verify_test_integrity.sh exited $rc while reporting 0 incapable files. That combination is not accounted for."
            exit 1
          fi

          echo "::warning title=Test integrity backlog::$incapable of $checked test files cannot report failure (ratchet baseline $BASELINE_INCAPABLE). Tracked by Plan 03. This step blocks on the backlog GROWING, not on the backlog existing."
          exit 0

  # ===========================================================================
  # The Debug build turns on -fsanitize=address -fsanitize=undefined -mavx2 in
  # CMakeLists.txt:17. This job runs that configuration and reports it
  # truthfully. It does not claim the suite is green under sanitizers.
  #
  # Measured locally on this tree, two tests fail in Debug that pass in Release.
  # Both are recorded with their causes in .github/ci/known-test-failures.txt
  # under label `asan`:
  #   abi_test_cpp_header_compiles  aborts before main() with "ASan runtime does
  #                                 not come first in initial library list" --
  #                                 CMakeLists.txt gives the sanitizer flags to
  #                                 CMAKE_C_FLAGS_DEBUG and never to
  #                                 CMAKE_CXX_FLAGS_DEBUG, so the C++ test
  #                                 binary is uninstrumented while the library
  #                                 it links is not.
  #   audio_test_basic              LeakSanitizer reports ~38 KB leaked from
  #                                 libpipewire/libasound inside snd_pcm_open.
  # On a GitHub runner the audio one may not reproduce (no sound device), so it
  # is listed rather than assumed either way; if it passes there, the allowlist
  # reports it as STALE and it can be deleted.
  #
  # No warning gate here: this build legitimately emits ld warnings from libasan
  # itself, which the scoped grep in build-and-test correctly ignores.
  # ===========================================================================
  asan-ubsan:
    name: ASan + UBSan (Debug)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libnuma-dev libjemalloc-dev libasound2-dev

      - name: Configure (Debug; sanitizers come from CMAKE_C_FLAGS_DEBUG)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: CI gate scripts are tracked by git
        run: scripts/check_gate_scripts_tracked.sh

      - name: Test suite under sanitizers
        run: .github/ci/run-tests.sh build-asan asan "$FLAKY_TESTS" 3

      - name: Benchmark methodology gate
        run: scripts/verify_benchmark_methodology.sh

  # ===========================================================================
  # THIS JOB IS EXPECTED TO BE RED. Read this before touching branch protection.
  #
  # Building without Vulkan does not work.
  # src/runtime/lgx_intent_allocator.c guards its other two Vulkan call sites
  # with `#if HAVE_VULKAN` (lines 152 and 195) but calls lgx_gpu_alloc()
  # unguarded at line 278, while src/runtime/lgx_gpu_pool.c -- the only
  # definition of that symbol -- is compiled only when CMake found Vulkan. The
  # result, reproduced locally:
  #
  #   $ cmake -S . -B build-novk -DCMAKE_BUILD_TYPE=Release \
  #         -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
  #   -- Vulkan not found - GPU memory pool features will be disabled
  #   $ cmake --build build-novk
  #   /usr/bin/ld: liblgx_runtime.so.1.0.1: undefined reference to `lgx_gpu_alloc'
  #   ... exit 2
  #
  # It is left failing on purpose rather than deleted, because deleting it is how
  # the defect became invisible in the first place. It fails loudly, it says
  # why, and build-and-test does not depend on it, so the merge gate is
  # unaffected. Do not add it to required checks while it is red.
  #
  # When Plan 01 guards line 278 the build stops failing and the final step below
  # exits 0 on its own. At that point delete that step and the job becomes a
  # real gate; nothing else needs to change.
  # ===========================================================================
  no-vulkan:
    name: 'no-vulkan: KNOWN FAILING - unguarded lgx_gpu_alloc (Plan 01)'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately NO libvulkan-dev. GitHub's Ubuntu image ships a Vulkan
      # runtime, so the absence is also forced explicitly below rather than
      # being left to whatever the image happens to contain.
      - name: Install dependencies (deliberately no libvulkan-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libnuma-dev libjemalloc-dev libasound2-dev

      - name: Configure without Vulkan
        run: |
          cmake -S . -B build-novk -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON
          if ! grep -q 'HAVE_VULKAN=0' build-novk/CMakeFiles/lgx_runtime.dir/flags.make; then
            echo "::error::Vulkan was NOT actually disabled; this job would not test what it claims."
            grep -n 'HAVE_VULKAN' build-novk/CMakeFiles/lgx_runtime.dir/flags.make || true
            exit 1
          fi
          echo "Confirmed: HAVE_VULKAN=0 for liblgx_runtime."

      - name: Build without Vulkan (expected to fail)
        id: build
        continue-on-error: true
        run: cmake --build build-novk -j"$(nproc)" 2>&1 | tee novk-build.log

      - name: Report the defect
        if: always()
        run: |
          {
            echo "### no-vulkan build: KNOWN DEFECT"
            echo ""
            echo "src/runtime/lgx_intent_allocator.c:278 calls lgx_gpu_alloc() with no"
            echo '`#if HAVE_VULKAN` guard, but src/runtime/lgx_gpu_pool.c -- the only'
            echo "definition of that symbol -- is compiled only when CMake found Vulkan."
            echo "Without Vulkan, liblgx_runtime therefore references a symbol nothing defines."
            echo ""
            echo "Tracked for Plan 01. build-and-test does not depend on this job, and this"
            echo "job is deliberately not in required checks while it is red."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.build.outcome }}" != "failure" ]; then
            echo "::notice::The no-Vulkan build SUCCEEDED. The lgx_gpu_alloc defect appears fixed."
            echo "Delete this step and remove 'continue-on-error' from the build step; the job is now a real gate."
            exit 0
          fi

          if grep -q "undefined reference to .lgx_gpu_alloc" novk-build.log; then
            echo "::error title=Known defect (Plan 01)::liblgx_runtime has an undefined reference to lgx_gpu_alloc -- the unguarded call at src/runtime/lgx_intent_allocator.c:278."
            echo "This job is failing ON PURPOSE to document a real, unfixed defect. It turns green by itself when Plan 01 guards the call."
            exit 1
          fi

          echo "::error::The no-Vulkan build failed, but not on the known lgx_gpu_alloc defect."
          echo "Either Plan 01 has fixed the real cause (in which case see the build log) or a"
          echo "different defect has appeared. This is NOT the documented failure."
          exit 1