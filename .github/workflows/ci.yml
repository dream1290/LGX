name: Continuous Integration

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format-14 \
            clang-tidy-14 \
            cppcheck
      
      - name: Check code formatting
        run: |
          find src include tests -name '*.c' -o -name '*.h' | \
            xargs clang-format-14 --dry-run --Werror
      
      - name: Run cppcheck
        run: |
          cppcheck --enable=all --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            -I include \
            src/
      
      - name: Check for common security issues
        run: |
          ! grep -r "strcpy\|strcat\|sprintf\|gets" src/ || \
            (echo "ERROR: Unsafe string functions found" && exit 1)

  build-and-test:
    name: Build & Test - ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    needs: code-quality
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]
        compiler: [gcc-11, gcc-12, clang-14, clang-15]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-22.04
            compiler: gcc-11
            cc: gcc-11
            cxx: g++-11
            packages: gcc-11 g++-11
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            packages: gcc-12 g++-12
          - os: ubuntu-22.04
            compiler: clang-14
            cc: clang-14
            cxx: clang++-14
            packages: clang-14
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
            packages: clang-15
          - os: ubuntu-20.04
            compiler: gcc-11
            cc: gcc-11
            cxx: g++-11
            packages: gcc-11 g++-11
        exclude:
          - os: ubuntu-20.04
            compiler: gcc-12
          - os: ubuntu-20.04
            compiler: clang-14
          - os: ubuntu-20.04
            compiler: clang-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libjemalloc-dev \
            libvulkan-dev \
            vulkan-validationlayers \
            ${{ matrix.packages }}
      
      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_INSTALL_PREFIX=/tmp/lgx-install \
            -DENABLE_TESTING=ON
      
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure \
            --timeout 300 \
            -C ${{ matrix.build_type }} || true
      
      - name: Test installation
        run: |
          cmake --install build
          
          # Verify headers
          test -f /tmp/lgx-install/include/lgx_runtime.h
          test -f /tmp/lgx-install/include/lgx_types.h
          test -f /tmp/lgx-install/include/lgx_version.h
          
          # Verify library
          test -f /tmp/lgx-install/lib/liblgx_runtime.so
          test -f /tmp/lgx-install/lib/liblgx_runtime.so.1
          test -f /tmp/lgx-install/lib/liblgx_runtime.so.1.0.1
          
          # Verify pkg-config
          export PKG_CONFIG_PATH=/tmp/lgx-install/lib/pkgconfig
          pkg-config --exists lgx_runtime
          pkg-config --modversion lgx_runtime
          pkg-config --cflags lgx_runtime
          pkg-config --libs lgx_runtime
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/Testing/
            build/**/*_results.txt
          retention-days: 7

  sanitizer-tests:
    name: Sanitizer Tests - ${{ matrix.sanitizer }}
    runs-on: ubuntu-22.04
    needs: code-quality
    
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
        include:
          - sanitizer: address
            flags: "-fsanitize=address -fno-omit-frame-pointer"
            env: "ASAN_OPTIONS=detect_leaks=1:check_initialization_order=1"
          - sanitizer: undefined
            flags: "-fsanitize=undefined -fno-omit-frame-pointer"
            env: "UBSAN_OPTIONS=print_stacktrace=1"
          - sanitizer: thread
            flags: "-fsanitize=thread"
            env: "TSAN_OPTIONS=second_deadlock_stack=1"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-15 \
            libjemalloc-dev \
            libvulkan-dev
      
      - name: Configure with sanitizer
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_CXX_COMPILER=clang++-15 \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DENABLE_TESTING=ON
      
      - name: Build
        run: cmake --build build
      
      - name: Run tests with sanitizer
        env:
          SANITIZER_ENV: ${{ matrix.env }}
        run: |
          cd build
          eval $SANITIZER_ENV ctest --output-on-failure --timeout 600
      
      - name: Upload sanitizer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs-${{ matrix.sanitizer }}
          path: build/Testing/
          retention-days: 7

  multi-distro:
    name: Multi-Distro - ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: code-quality
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            container: ubuntu:22.04
            install: "apt-get update && apt-get install -y"
            packages: "build-essential cmake ninja-build pkg-config libjemalloc-dev git"
          
          - distro: ubuntu-20.04
            container: ubuntu:20.04
            install: "apt-get update && apt-get install -y"
            packages: "build-essential cmake ninja-build pkg-config libjemalloc-dev git"
          
          - distro: fedora-38
            container: fedora:38
            install: "dnf install -y"
            packages: "gcc gcc-c++ cmake ninja-build pkgconf-pkg-config jemalloc-devel git make"
          
          - distro: fedora-39
            container: fedora:39
            install: "dnf install -y"
            packages: "gcc gcc-c++ cmake ninja-build pkgconf-pkg-config jemalloc-devel git make"
          
          - distro: arch-linux
            container: archlinux:latest
            install: "pacman -Syu --noconfirm"
            packages: "base-devel cmake ninja pkgconf jemalloc git"
    
    container:
      image: ${{ matrix.container }}
    
    steps:
      - name: Install git (required for checkout)
        run: ${{ matrix.install }} git
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: ${{ matrix.install }} ${{ matrix.packages }}
      
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build
      
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --timeout 300
      
      - name: Test installation
        run: |
          cmake --install build --prefix /tmp/lgx-install
          test -f /tmp/lgx-install/lib/liblgx_runtime.so

  performance-check:
    name: Performance Regression Check
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libjemalloc-dev \
            python3 \
            python3-pip
      
      - name: Build current version
        run: |
          cmake -B build-current -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-current
      
      - name: Run current performance tests
        run: |
          if [ -d "build-current/tests/performance" ]; then
            cd build-current/tests/performance
            for bench in perf_test_*; do
              [ -x "$bench" ] && ./"$bench" || true
            done
            cp benchmark_results_*.txt ../../.. 2>/dev/null || true
          else
            echo "Performance tests directory not found, skipping"
          fi
      
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-current
          path: benchmark_results_*.txt
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-22.04
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-11 \
            g++-11 \
            lcov \
            libjemalloc-dev
      
      - name: Configure with coverage
        env:
          CC: gcc-11
          CXX: g++-11
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DENABLE_TESTING=ON
      
      - name: Build
        run: cmake --build build
      
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure
      
      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info
          lcov --list coverage.info
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.info
          flags: unittests
          name: codecov-lgx-runtime
          fail_ci_if_error: false

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build-and-test, sanitizer-tests, multi-distro]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Sanitizer Tests: ${{ needs.sanitizer-tests.result }}"
          echo "Multi-Distro: ${{ needs.multi-distro.result }}"
          
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.build-and-test.result }}" != "success" ] || \
             [ "${{ needs.sanitizer-tests.result }}" != "success" ] || \
             [ "${{ needs.multi-distro.result }}" != "success" ]; then
            echo "CI FAILED"
            exit 1
          fi
          
          echo "CI PASSED"
